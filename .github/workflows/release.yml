name: Multi-Platform Release

on:
  push:
    tags:
      - 'v*.*.*'

# Default to least-privilege read permissions across all jobs
permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop Release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Build Rust Core Release DLL
        working-directory: rust
        run: cargo build --release

      - name: Copy DLL to Flutter Windows Runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "app\windows"
          Copy-Item "rust\target\release\appendix_core.dll" "app\appendix_core.dll" -Force
          Copy-Item "rust\target\release\appendix_core.dll" "app\windows\appendix_core.dll" -Force

      - name: Build Flutter Windows Desktop
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          $dist = "dist\appendix-windows-x64-$ver"
          New-Item -ItemType Directory -Force -Path $dist
          Copy-Item -Path "app\build\windows\x64\runner\Release\*" -Destination $dist -Recurse
          # Ensure DLL sits directly alongside the runner executable
          Copy-Item -Path "rust\target\release\appendix_core.dll" -Destination $dist -Force
          Copy-Item -Path "LICENSE", "README.md", "THIRD_PARTY_NOTICES.md", "INSTALL_WINDOWS.md" -Destination $dist -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\appendix-windows-x64.zip" -Force
          Get-FileHash -Path "dist\appendix-windows-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  appendix-windows-x64.zip" } | Out-File -Encoding ascii "dist\appendix-windows-x64.sha256"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appendix-windows-x64
          path: dist/appendix-windows-x64.*

  build-android:
    name: Build Android Release Packages (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Setup Rust & Android NDK Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile Rust Core for Android (arm64-v8a & x86_64)
        working-directory: rust
        run: cargo ndk -t arm64-v8a -t x86_64 -o ../app/android/app/src/main/jniLibs build --release

      - name: Configure Production Signing (Optional Secrets Fallback)
        # If GitHub Secrets are configured (KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, STORE_PASSWORD),
        # decode the keystore and pass variables. Otherwise, build.gradle.kts falls back gracefully
        # to the debug keystore for validation builds.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Production keystore secret detected. Decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/android/release.keystore
            echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            echo "No production keystore secrets configured; build will proceed with debug-signed validation package."
          fi

      - name: Build Android Release APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Build Android Release AppBundle (AAB)
        working-directory: app
        run: flutter build appbundle --release

      - name: Package Android Artifacts
        run: |
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/appendix-android.apk
          cp app/build/app/outputs/bundle/release/app-release.aab dist/appendix-android.aab
          sha256sum dist/appendix-android.apk | sed 's|dist/||' > dist/appendix-android-apk.sha256
          sha256sum dist/appendix-android.aab | sed 's|dist/||' > dist/appendix-android-aab.sha256

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appendix-android
          path: dist/appendix-android*

  build-macos:
    name: Build macOS Universal Release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Compile macOS Universal dylib
        working-directory: rust
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          mkdir -p ../app/macos
          lipo -create \
            target/aarch64-apple-darwin/release/libappendix_core.dylib \
            target/x86_64-apple-darwin/release/libappendix_core.dylib \
            -output ../app/macos/libappendix_core.dylib

      - name: Build Flutter macOS
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package macOS Artifact
        run: |
          mkdir -p dist
          APP_PATH="app/build/macos/Build/Products/Release/appendix.app"
          test -d "$APP_PATH"
          test -f "$APP_PATH/Contents/Frameworks/libappendix_core.dylib"
          (cd app/build/macos/Build/Products/Release && zip -r -y "${GITHUB_WORKSPACE}/dist/appendix-macos.zip" appendix.app)
          shasum -a 256 dist/appendix-macos.zip | sed 's|dist/||' > dist/appendix-macos.sha256

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appendix-macos
          path: dist/appendix-macos.*

  validate-ios:
    name: Validate iOS App & Embedded Keyboard Extension
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust & iOS Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: Build Apple Platforms (XCFramework)
        run: |
          chmod +x scripts/build_apple.sh
          ./scripts/build_apple.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'

      - name: Install Dependencies
        working-directory: app
        run: flutter pub get

      - name: Validate iOS App & Keyboard Extension Build
        run: |
          xcodebuild -workspace app/ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: appendix-windows-x64
          path: release_assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: appendix-android
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: appendix-macos
          path: release_assets

      - name: Create Combined Checksums & Add Release Manifests
        run: |
          cp THIRD_PARTY_NOTICES.md release_assets/
          cp models/model_manifest.json release_assets/
          cd release_assets
          cat *.sha256 > SHA256SUMS.txt

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          body: |
            Appendix v0.2.0 is an early testing release for Windows, macOS, and Android.

            - Windows: unsigned portable ZIP; SmartScreen may warn.
            - macOS: universal app ZIP; not Developer ID signed or notarized.
            - Android: debug-signed APK for sideloading and evaluation only; not Play Store ready.
            - iOS: source and Simulator-tested app/keyboard are included in the repository, but there is no signed IPA or App Store release. Physical-device signing, provisioning, and App Store work remain pending.

            Verify downloaded packages with SHA256SUMS.txt.
          draft: false
          prerelease: false
          generate_release_notes: true
